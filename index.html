<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        /* Main Container */
        .todo-container {
            width: 100%;
            max-width: 600px;

            background: white;
            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.2);
        }

        /* Heading */
        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
        }

        /* Input */
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #task-input {
            flex: 1;

            padding: 14px;

            border: 2px solid #ddd;
            border-radius: 10px;

            font-size: 16px;
            outline: none;
        }

        #task-input:focus {
            border-color: #667eea;
        }

        #add-btn {
            padding: 14px 20px;

            border: none;
            border-radius: 10px;

            background: #667eea;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        #add-btn:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        /* Task Counter */
        .task-info {
            display: flex;
            justify-content: space-between;

            margin-bottom: 15px;
            padding: 12px;

            background: #f5f6ff;

            border-radius: 10px;

            color: #555;
            font-size: 14px;
        }

        /* Task List */
        #task-list {
            list-style: none;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 14px;

            margin-bottom: 10px;

            background: #f8f9ff;

            border-radius: 10px;

            border: 1px solid #eee;

            transition: 0.3s;
        }

        .task:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        /* Checkbox */
        .task-checkbox {
            width: 20px;
            height: 20px;

            cursor: pointer;

            accent-color: #667eea;
        }

        /* Task Text */
        .task-text {
            flex: 1;

            font-size: 16px;
            color: #333;

            word-break: break-word;
        }

        /* Completed Task */
        .task.completed .task-text {
            text-decoration: line-through;
            color: #999;
        }

        /* Buttons */
        .actions {
            display: flex;
            gap: 6px;
        }

        .actions button {
            border: none;
            padding: 7px 10px;

            border-radius: 7px;

            cursor: pointer;

            transition: 0.2s;
        }

        .edit-btn {
            background: #dbeafe;
            color: #2563eb;
        }

        .edit-btn:hover {
            background: #bfdbfe;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        /* Empty Message */
        #empty-message {
            text-align: center;
            padding: 30px 10px;

            color: #999;
        }

        /* =========================
           RESPONSIVE DESIGN
        ========================== */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .todo-container {
                padding: 20px;
            }

            .input-area {
                flex-direction: column;
            }

            #add-btn {
                width: 100%;
            }

            .task {
                align-items: flex-start;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="todo-container">

        <div class="header">
            <h1>📝 My To-Do List</h1>
            <p>Organize your day and get things done!</p>
        </div>

        <!-- Add Task -->
        <div class="input-area">

            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
            >

            <button id="add-btn">
                Add Task
            </button>

        </div>

        <!-- Task Counter -->
        <div class="task-info">

            <span id="task-count">
                0 tasks
            </span>

            <span id="completed-count">
                0 completed
            </span>

        </div>

        <!-- Task List -->
        <ul id="task-list"></ul>

        <div id="empty-message">
            🎯 No tasks yet. Add your first task!
        </div>

    </div>


    <script>

        /* =========================
           DOM ELEMENTS
        ========================== */

        const taskInput =
            document.getElementById("task-input");

        const addButton =
            document.getElementById("add-btn");

        const taskList =
            document.getElementById("task-list");

        const emptyMessage =
            document.getElementById("empty-message");

        const taskCount =
            document.getElementById("task-count");

        const completedCount =
            document.getElementById("completed-count");


        /* =========================
           LOAD FROM LOCAL STORAGE
        ========================== */

        let tasks =
            JSON.parse(
                localStorage.getItem("tasks")
            ) || [];


        /* =========================
           SAVE TO LOCAL STORAGE
        ========================== */

        function saveTasks() {

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );

        }


        /* =========================
           DISPLAY TASKS
        ========================== */

        function displayTasks() {

            taskList.innerHTML = "";

            /* Empty list */

            if (tasks.length === 0) {

                emptyMessage.style.display = "block";

            } else {

                emptyMessage.style.display = "none";
            }


            tasks.forEach(function(task) {

                const li =
                    document.createElement("li");

                li.className = "task";


                /* Completed styling */

                if (task.completed) {

                    li.classList.add("completed");

                }


                /* Checkbox */

                const checkbox =
                    document.createElement("input");

                checkbox.type = "checkbox";

                checkbox.className =
                    "task-checkbox";

                checkbox.checked =
                    task.completed;


                /* Mark completed */

                checkbox.addEventListener(
                    "change",
                    function() {

                        task.completed =
                            checkbox.checked;

                        saveTasks();

                        displayTasks();

                    }
                );


                /* Task text */

                const taskText =
                    document.createElement("span");

                taskText.className =
                    "task-text";

                taskText.textContent =
                    task.text;


                /* Actions */

                const actions =
                    document.createElement("div");

                actions.className = "actions";


                /* Edit */

                const editButton =
                    document.createElement("button");

                editButton.className =
                    "edit-btn";

                editButton.textContent =
                    "✏️ Edit";


                editButton.addEventListener(
                    "click",
                    function() {

                        editTask(task.id);

                    }
                );


                /* Delete */

                const deleteButton =
                    document.createElement("button");

                deleteButton.className =
                    "delete-btn";

                deleteButton.textContent =
                    "🗑️ Delete";


                deleteButton.addEventListener(
                    "click",
                    function() {

                        deleteTask(task.id);

                    }
                );


                /* Build task */

                actions.appendChild(editButton);

                actions.appendChild(deleteButton);

                li.appendChild(checkbox);

                li.appendChild(taskText);

                li.appendChild(actions);

                taskList.appendChild(li);

            });


            updateCounter();

        }


        /* =========================
           ADD TASK
        ========================== */

        function addTask() {

            const text =
                taskInput.value.trim();


            if (text === "") {

                alert("Please enter a task!");

                return;
            }


            const newTask = {

                id: Date.now(),

                text: text,

                completed: false

            };


            tasks.push(newTask);

            saveTasks();

            taskInput.value = "";

            displayTasks();

            taskInput.focus();

        }


        /* =========================
           EDIT TASK
        ========================== */

        function editTask(id) {

            const task =
                tasks.find(function(task) {

                    return task.id === id;

                });


            if (!task) {
                return;
            }


            const newText =
                prompt(
                    "Edit your task:",
                    task.text
                );


            if (
                newText !== null &&
                newText.trim() !== ""
            ) {

                task.text =
                    newText.trim();

                saveTasks();

                displayTasks();

            }

        }


        /* =========================
           DELETE TASK
        ========================== */

        function deleteTask(id) {

            const confirmDelete =
                confirm(
                    "Delete this task?"
                );


            if (!confirmDelete) {
                return;
            }


            tasks =
                tasks.filter(function(task) {

                    return task.id !== id;

                });


            saveTasks();

            displayTasks();

        }


        /* =========================
           TASK COUNTER
        ========================== */

        function updateCounter() {

            const total =
                tasks.length;


            const completed =
                tasks.filter(function(task) {

                    return task.completed;

                }).length;


            taskCount.textContent =
                total +
                (total === 1 ? " task" : " tasks");


            completedCount.textContent =
                completed + " completed";

        }


        /* =========================
           BUTTON EVENTS
        ========================== */

        addButton.addEventListener(
            "click",
            addTask
        );


        /* Press Enter to add */

        taskInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    addTask();

                }

            }
        );


        /* =========================
           START APP
        ========================== */

        displayTasks();

    </script>

</body>

</html>
